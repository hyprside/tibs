[package]
name = "tibs-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = "0.6.3"
freedesktop_entry_parser = "1.3.0"
futures-util = "0.3.31"
libc = "0.2.171"
linux-raw-sys = { version = "0.10.0", features = ["ioctl"] }
log = "0.4.27"
nix = "0.30.1"
pam = { git = "https://github.com/coffeeispower/pam-rs", version = "0.8.0" }
smol = "2.0.2"
tibs-service-definitions = { path = "../tibs-service-definitions" }
uzers = "0.12.1"
zbus_systemd = { version = "0.25701.0", features = ["systemd1"] }
