[package]
name = "tibs-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = "0.6.3"
freedesktop_entry_parser = "1.3.0"
futures-util = "0.3.31"
log = "0.4.27"
pam = { git = "https://github.com/coffeeispower/pam-rs", version = "0.8.0" }
smol = "2.0.2"
thiserror = "2.0.20"
tibs-service-definitions = { path = "../tibs-service-definitions" }
uzers = "0.12.1"
zbus_systemd = { version = "0.26100.0", features = ["systemd1", "zbus-async-smol", "login1"], default-features = false }
