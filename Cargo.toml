[package]
name = "tibs"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    ".",
    "crates/tibs-fake-services",
    "crates/tibs-linux",
    "crates/tibs-service-definitions",
]
resolver = "2"

[dependencies]
tibs-service-definitions = { path = "crates/tibs-service-definitions" }
tibs-fake-services = { path = "crates/tibs-fake-services", optional = true }
tibs-linux = { path = "crates/tibs-linux", optional = true }
glutin = "0.32.2"
raw-window-handle = "0.6.2"
drm = "0.14.1"
gbm = "0.18.0"
glfw = { version = "0.59.0", optional = true }
color-eyre = "0.6.3"
skia-safe = { version = "0.86.0", features = ["gl"] }
smol = "2.0.2"
assets_manager = { version = "0.12.4", features = ["hot-reloading"] }
rand = "0.9.0"
input = "0.9.1"
libc = "0.2.171"
xkbcommon = { version = "0.8.0", default-features = false }
hyprcursor = "0.0.3"
libhyprcursor-sys = "0.2.0"
cairo-rs = { version = "0.19.2", default-features = false }
env_logger = "0.11.8"
log = "0.4.27"

[dependencies.clay-layout]
features = ["debug"]
git = "https://github.com/coffeeispower/clay-rs"
rev = "59f2f5a607dac5df2fd7cd8dda7fb49ddd910c4f"

[build-dependencies]
gl_generator = "0"

[features]
default = ["fake-progress", "glfw", "linux"]
fake-progress = ["dep:tibs-fake-services"]
glfw = ["dep:glfw"]
linux = ["dep:tibs-linux"]
